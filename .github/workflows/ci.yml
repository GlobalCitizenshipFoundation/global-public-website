name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.13.0"
  NEXT_TELEMETRY_DISABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.filter.outputs.root }}
      web: ${{ steps.filter.outputs.web }}
      cms: ${{ steps.filter.outputs.cms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            root:
              - "biome.json"
              - "knip.json"
              - "lint-staged.config.mjs"
              - "tsconfig.base.json"
              - "pnpm-workspace.yaml"
              - "pnpm-lock.yaml"
              - "package.json"
              - ".npmrc"
              - ".github/workflows/**"
            web:
              - "apps/web/**"
              - "packages/**"
            cms:
              - "apps/cms/**"
              - "packages/**"

  deps:
    name: deps (pnpm store cache)
    needs: detect-changes
    if: needs.detect-changes.outputs.root == 'true' || needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.cms == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Update Corepack (signature fixes)
        run: npm i -g corepack@latest

      - name: Enable Corepack + activate pnpm from packageManager
        run: |
          corepack enable
          PNPM_SPEC="$(node -p "require('./package.json').packageManager")"
          echo "Using pnpm spec: $PNPM_SPEC"
          corepack prepare "$PNPM_SPEC" --activate
          pnpm --version

      - name: Prefetch deps to pnpm store
        run: pnpm fetch --frozen-lockfile

  web:
    name: web
    needs: [detect-changes, deps]
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.root == 'true'
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Assert required env (web)
        run: |
          test -n "${NEXT_PUBLIC_SITE_URL}" || (echo "Missing NEXT_PUBLIC_SITE_URL (set GitHub Actions variable vars.NEXT_PUBLIC_SITE_URL)" && exit 1)
          test -n "${NEXT_PUBLIC_SANITY_PROJECT_ID}" || (echo "Missing NEXT_PUBLIC_SANITY_PROJECT_ID (set vars.NEXT_PUBLIC_SANITY_PROJECT_ID)" && exit 1)
          test -n "${NEXT_PUBLIC_SANITY_DATASET}" || (echo "Missing NEXT_PUBLIC_SANITY_DATASET (set vars.NEXT_PUBLIC_SANITY_DATASET)" && exit 1)
          test -n "${NEXT_PUBLIC_SANITY_API_VERSION}" || (echo "Missing NEXT_PUBLIC_SANITY_API_VERSION (set vars.NEXT_PUBLIC_SANITY_API_VERSION)" && exit 1)

      - name: Setup Node (restore pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Update Corepack (signature fixes)
        run: npm i -g corepack@latest

      - name: Enable Corepack + activate pnpm from packageManager
        run: |
          corepack enable
          PNPM_SPEC="$(node -p "require('./package.json').packageManager")"
          corepack prepare "$PNPM_SPEC" --activate
          pnpm --version

      - name: Install (offline)
        run: pnpm install --frozen-lockfile --offline

      - name: Build types
        run: pnpm -C packages/types build

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextcache-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/**', 'packages/**') }}
          restore-keys: |
            nextcache-${{ runner.os }}-${{ env.NODE_VERSION }}-

      - name: Lint (no warnings)
        run: pnpm -C apps/web lint:ci

      - name: Typecheck
        run: pnpm -C apps/web typecheck

      - name: Build web
        run: pnpm -C apps/web build

  cms:
    name: cms
    needs: [detect-changes, deps]
    if: needs.detect-changes.outputs.cms == 'true' || needs.detect-changes.outputs.root == 'true'
    runs-on: ubuntu-latest

    env:
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
      SANITY_STUDIO_APP_ID: ${{ vars.SANITY_STUDIO_APP_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Assert required env (cms)
        run: |
          test -n "${SANITY_STUDIO_PROJECT_ID}" || (echo "Missing SANITY_STUDIO_PROJECT_ID (set vars.SANITY_STUDIO_PROJECT_ID)" && exit 1)
          test -n "${SANITY_STUDIO_DATASET}" || (echo "Missing SANITY_STUDIO_DATASET (set vars.SANITY_STUDIO_DATASET)" && exit 1)
          test -n "${SANITY_STUDIO_APP_ID}" || (echo "Missing SANITY_STUDIO_APP_ID (set vars.SANITY_STUDIO_APP_ID)" && exit 1)

      - name: Setup Node (restore pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Update Corepack (signature fixes)
        run: npm i -g corepack@latest

      - name: Enable Corepack + activate pnpm from packageManager
        run: |
          corepack enable
          PNPM_SPEC="$(node -p "require('./package.json').packageManager")"
          corepack prepare "$PNPM_SPEC" --activate
          pnpm --version

      - name: Install (offline)
        run: pnpm install --frozen-lockfile --offline

      - name: Build types
        run: pnpm -C packages/types build

      - name: Lint (no warnings)
        run: pnpm -C apps/cms lint:ci

      - name: Typecheck
        run: pnpm -C apps/cms typecheck

      - name: Build CMS
        run: pnpm -C apps/cms build
