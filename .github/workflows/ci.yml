name: CI

on:
  pull_request:
  push:
    branches: ['main', 'master']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      cms: ${{ steps.filter.outputs.cms }}
    steps:
      - uses: actions/checkout@v4

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - "apps/web/**"
              - "packages/**"
              - "eslint.config.mjs"
              - "prettier.config.cjs"
              - "tsconfig.base.json"
              - "package.json"
              - "package-lock.json"
            cms:
              - "apps/cms/**"
              - "packages/**"
              - "eslint.config.mjs"
              - "prettier.config.cjs"
              - "tsconfig.base.json"
              - "package.json"
              - "package-lock.json"

  web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Lint (no warnings)
        run: npm -w @gcf/web run lint:ci

      - name: Typecheck
        run: npm run typecheck:web

      - name: Build
        run: npm run build:web

  cms:
    needs: detect-changes
    if: needs.detect-changes.outputs.cms == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Lint (no warnings)
        run: npm -w @gcf/cms run lint:ci

      - name: Typecheck
        run: npm run typecheck:cms

      - name: Build
        run: npm run build:cms
