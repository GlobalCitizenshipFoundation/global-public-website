name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      cms: ${{ steps.filter.outputs.cms }}
    steps:
      - uses: actions/checkout@v4

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - "apps/web/**"
              - "packages/**"
              - "biome.json"
              - "knip.json"
              - "lint-staged.config.mjs"
              - "tsconfig.base.json"
              - "pnpm-workspace.yaml"
              - "pnpm-lock.yaml"
              - "package.json"
              - ".npmrc"
            cms:
              - "apps/cms/**"
              - "packages/**"
              - "biome.json"
              - "knip.json"
              - "lint-staged.config.mjs"
              - "tsconfig.base.json"
              - "pnpm-workspace.yaml"
              - "pnpm-lock.yaml"
              - "package.json"
              - ".npmrc"

  web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install (pnpm workspaces)
        run: pnpm -w install --frozen-lockfile

      - name: Lint (no warnings)
        run: pnpm -C apps/web lint:ci

      - name: Typecheck
        run: pnpm -C apps/web typecheck

      - name: Build types
        run: pnpm -C packages/types build

      - name: Build web
        run: pnpm -C apps/web build

  cms:
    needs: detect-changes
    if: needs.detect-changes.outputs.cms == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install (pnpm workspaces)
        run: pnpm -w install --frozen-lockfile

      - name: Lint (no warnings)
        run: pnpm -C apps/cms lint:ci

      - name: Typecheck
        run: pnpm -C apps/cms typecheck

      - name: Build CMS
        run: pnpm -C apps/cms build
