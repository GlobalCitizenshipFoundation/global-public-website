[build]
  command = corepack enable && corepack prepare pnpm@10.29.1 --activate && pnpm -w install --frozen-lockfile && pnpm -C packages/types build && pnpm -C apps/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "24.13.0"
  NPM_FLAGS = "--no-audit --no-fund"

[[plugins]]
  package = "@netlify/plugin-nextjs"
